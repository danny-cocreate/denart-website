name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        env:
          PRETIX_API_TOKEN: ${{ secrets.PRETIX_API_TOKEN }}
          CHECKOUT_WIDGET_READ_TOKEN: ${{ secrets.CHECKOUT_WIDGET_READ_TOKEN }}
        run: npm run build

      - name: Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: "65002"
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          echo "HOST=$HOST"
          echo "USER=$USER"
          echo "PORT=$PORT"
          echo "REMOTE_PATH=$REMOTE_PATH"
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          if [ ! -d dist/checkout-widget ]; then
            echo "dist/checkout-widget missing — widget download did not run" >&2
            exit 1
          fi
          SSH_OPTS="-p $PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          # Widget first so --delete lands even if the full-site copy later drops
          rsync -az --delete -e "ssh $SSH_OPTS" \
            dist/checkout-widget/ \
            $USER@$HOST:$REMOTE_PATH/checkout-widget/
          attempt=1
          until rsync -az -e "ssh $SSH_OPTS" dist/ "$USER@$HOST:$REMOTE_PATH/"; do
            if [ "$attempt" -ge 4 ]; then
              echo "full-site rsync failed after $attempt attempts" >&2
              exit 1
            fi
            echo "full-site rsync dropped (attempt $attempt); retrying in $((attempt * 8))s"
            sleep $((attempt * 8))
            attempt=$((attempt + 1))
          done
