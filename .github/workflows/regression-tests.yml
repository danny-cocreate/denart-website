name: Regression Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lean regression suite
        run: npm run test:regression

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  notify-telegram:
    needs: regression
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Playwright artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: artifacts

      - name: Send Telegram status notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.regression.result }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set; skipping Telegram notification."
            exit 0
          fi

          case "$RESULT" in
            success) STATUS_LABEL="[PASS]" ;;
            failure) STATUS_LABEL="[FAIL]" ;;
            cancelled) STATUS_LABEL="[CANCELLED]" ;;
            *) STATUS_LABEL="[INFO]" ;;
          esac

          node - <<'NODE' > /tmp/regression-test-lines.txt
          const fs = require('node:fs');
          const path = require('node:path');

          function findFile(startDir, fileName) {
            const entries = fs.readdirSync(startDir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(startDir, entry.name);
              if (entry.isFile() && entry.name === fileName) return fullPath;
              if (entry.isDirectory()) {
                const found = findFile(fullPath, fileName);
                if (found) return found;
              }
            }
            return null;
          }

          function gatherSpecs(suite, parents = [], output = []) {
            const nextParents = suite.title ? [...parents, suite.title] : parents;
            for (const child of suite.suites || []) {
              gatherSpecs(child, nextParents, output);
            }
            for (const spec of suite.specs || []) {
              const title = [...nextParents, spec.title].filter(Boolean).join(' > ');
              let finalStatus = 'skipped';
              for (const t of spec.tests || []) {
                const lastResult = t.results && t.results.length ? t.results[t.results.length - 1] : null;
                const status = (lastResult && lastResult.status) || t.status || 'unknown';
                if (status === 'failed' || status === 'timedOut' || status === 'interrupted') {
                  finalStatus = 'failed';
                  break;
                }
                if (status === 'passed') {
                  finalStatus = 'passed';
                }
                if (status === 'skipped' && finalStatus !== 'passed') {
                  finalStatus = 'skipped';
                }
              }
              output.push({ title, status: finalStatus });
            }
            return output;
          }

          const rootDir = path.resolve('artifacts');
          if (!fs.existsSync(rootDir)) {
            console.log('No detailed test results found.');
            process.exit(0);
          }

          const reportPath = findFile(rootDir, 'regression-results.json');
          if (!reportPath) {
            console.log('No detailed test results found.');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const specs = gatherSpecs(report, [], []);
          if (!specs.length) {
            console.log('No detailed test results found.');
            process.exit(0);
          }

          const icon = {
            passed: '[PASS]',
            failed: '[FAIL]',
            skipped: '[SKIP]',
            unknown: '[INFO]',
          };

          const lines = specs.map((s) => `${icon[s.status] || '[INFO]'} ${s.title}`);
          const failed = specs.filter((s) => s.status === 'failed').length;
          const passed = specs.filter((s) => s.status === 'passed').length;
          const skipped = specs.filter((s) => s.status === 'skipped').length;

          console.log(`Summary: ${passed} passed, ${failed} failed, ${skipped} skipped`);
          console.log(...lines);
          NODE

          DETAILS="$(cat /tmp/regression-test-lines.txt)"
          MESSAGE="$(printf '%s\n%s\n%s\n%s\n%s' \
            "$STATUS_LABEL Regression tests: $RESULT" \
            "Repo: $REPOSITORY" \
            "Workflow: $WORKFLOW_NAME" \
            "Branch: $BRANCH" \
            "Run: $RUN_URL")"
          MESSAGE="$(printf '%s\n\n%s' "$MESSAGE" "$DETAILS")"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MESSAGE"
